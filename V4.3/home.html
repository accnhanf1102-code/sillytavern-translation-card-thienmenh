 tinh tú chưa hề rơi rụng. Thần minh rảo bước giữa đỉnh núi, vòm rừng cùng tiếng sóng triều, đóng chặt luật pháp vào đại địa, ban thưởng sinh linh cho đất mẹ. </p><p data-v-4feb4217> Tộc tai dài chìm trong mộng cảnh trường xanh, lắng nghe tiếng lòng của đại thụ; tộc cánh trắng dựng thành trên tầng trời thẳm, đội ánh sáng làm vương miện; bầy thú học cách dùng lửa cùng bài ca, dâng máu tươi lên tổ linh; nhân loại trong vòng đời ngắn ngủi đắp nên vương tọa, thành trì cùng văn minh.<br data-v-4feb4217>Sắt rèn thành vương quyền, bông lúa đại diện cho trù phú, đồng vàng được ban cho trọng lượng, danh xưng được khắc vào bia đá.<br data-v-4feb4217>Trần thế nhờ đó mà phồn vinh, cũng từ đó mọc mầm hủ bại. </p><p data-v-4feb4217> Cho tới khi quỹ đạo tinh tú lệch hướng, biển hư vô nổi sóng triều.<br data-v-4feb4217>Cánh cổng mở ra tại nơi vốn dĩ không có cổng. Ánh sáng rạn nứt từ bình nguyên, đáy biển cùng tầng mây thẳm đâm xuyên thế giới này, những dị vật phi trần thế nương theo ánh sáng mà đến. Kẻ khoác thánh huy, kẻ mang vực thẫm, kẻ lấy cái chết đắp thành quốc gia, cùng những dị vật được xướng danh thần linh, đồng loạt cúi đầu ghé mắt soi mói thế giới này. </p><p data-v-4feb4217> Chư vương gãy kiếm, thánh giả câm lặng.<br data-v-4feb4217>Trên khắp dãy núi vang rền tiếng gầm nộ của cổ long, nhân loại giương cao cờ chiến tàn nát, tộc cánh trắng dệt nên vòm luật dưới ánh thần tích, đứa con của thảo nguyên lấy huyết minh giữ vững gió tây, cổ dân dưới lòng biển cùng chân núi cũng dâng lên lưỡi sắc của chính mình.<br data-v-4feb4217>Có thần minh bị chém rụng,<br data-v-4feb4217>Máu thần nhuộm đẫm muôn núi.<br data-v-4feb4217>Có đế quốc bị xóa sổ,<br data-v-4feb4217>Đến cả tàn tích cũng bị phong cát nuốt chửng.<br data-v-4feb4217>Có tên tuổi anh hùng, chỉ còn lại lời tưởng niệm thì thầm trước nấm mồ.<br data-v-4feb4217>Cuối cùng, vòm trời được khâu lại, vết nứt bị đóng chặt xuống địa phủ, muôn tinh tú lại quay về đúng quỹ đạo. </p><p data-v-4feb4217>Tai họa Giao Thoa bị trấn áp chôn vùi xuống lòng đại địa.<br data-v-4feb4217>Người đời gọi ngày hôm ấy là sự kết thúc của chiến tranh.</p><p data-v-4feb4217> Cổ long khép mắt giữa núi lửa cùng băng nguyên; ngai vàng của thần ngự chốn tầng cao, lời thần dụ ngày một thưa thớt; vòm trời thánh luật tan vỡ hóa thành di tích Khóc Không, mười ba hòn đảo lơ lửng cho đến nay vẫn treo trên biển mây.<br data-v-4feb4217>Những kẻ lắng nghe thấy lời thì thầm từ dị thế giới, vẫn đang cúi đầu tại nơi không ánh đèn, đem giọt máu tươi nhỏ vào những huy hiệu xa lạ. </p><p data-v-4feb4217> Thời gian gieo nên thành bang, vương miện cùng chợ hội trên vết thương. <br data-v-4feb4217>Kỷ nguyên Phục Hưng năm 488, bánh xe trần thế vẫn âm thầm cuộn chảy. </p><p data-v-4feb4217> Griffin hai đầu giương cánh thép tung trời, cầu bạch kim vắt ngang vòm không, luật sắt cùng vương miện đắp tô vinh quang đế quốc; rìu chiến thảo nguyên khẽ ngân bên yên, lời ca bên lửa trại chưa từng quên nợ máu biên thùy.<br data-v-4feb4217>Đô thành biển Nam rạng rỡ ánh đèn, vàng son, hoan lạc cùng tội lỗi chảy tràn như sóng triều; mũ sắt phương Bắc rực cháy trong gió, ngoài bức tường dài, sương lạnh năm lần bảy lượt gõ cửa.<br data-v-4feb4217>Đỉnh núi thánh, người cánh trắng trông ngóng chén vàng, coi trần thế là vương bụi; rừng ngọc bích hé lộ đường xưa, những người con thầm lặng lại lên đường viễn xứ. </p><div class="world-quote" data-v-4feb4217> Nghe kia, lữ giả<br data-v-4feb4217> Nghe tiếng thủy triều chưa ngớt nơi mép biển không, nghe gió chiều khóc than nơi chiến trường cũ kỹ<br data-v-4feb4217> Quỹ đạo sao hiện, hải trình chưa tỏ<br data-v-4feb4217> Anh hùng ngày cũ hóa thành bia đá, mầm sống mới lên chưa biết kính sợ; lấy niệm làm dẫn, góp cát thành tháp </div><div class="world-quote" data-v-4feb4217> Đi đi, lữ giả<br data-v-4feb4217> Vượt qua băng tuyết vĩnh hằng nơi tường thành phương Bắc, xuyên qua cát vàng vô tận nơi thảo nguyên tây phong<br data-v-4feb4217> Vết nứt sẽ mở ra, ngai vàng sẽ bỏ trống<br data-v-4feb4217> Thánh địa xưa hóa thành phế tích, kẻ lạc lối khó lòng phân biệt lối đi； lấy trần thế làm sách, vung kiếm làm bút </div><div class="update-section" data-v-4feb4217><h3 data-v-4feb4217>Nhận cập nhật mới nhất</h3><ul data-v-4feb4217><li data-v-4feb4217><a href="https://discord.com/channels/1134557553011998840/1448526819824504882" target="_blank" rel="noopener noreferrer" data-v-4feb4217>Kênh cập nhật *não</a></li></ul></div></div></details>',1))]))}},Wt=(0,M.A)(Ft,[['__scopeId','data-v-4feb4217']]),Xt={class:'vinyl-panel'},Gt={class:'mini-turntable'},Ut={class:'mini-base'},Yt={class:'mini-platter'},Jt={class:'track-name'},Qt={class:'player-controls'},Zt=['title'],en=(0,a.defineComponent)({__name:'VinylPlayer',setup(e){const t=[{name:'Chương 1',url:'https://files.catbox.moe/o1o64d.mp3'},{name:'Chương 2',url:'https://files.catbox.moe/vqs5tw.mp3'},{name:'Chương 3',url:'https://files.catbox.moe/b0o5l9.mp3'}],n=(0,a.ref)(0),l=(0,a.ref)(!1),o=(0,a.ref)(!0),c=(0,a.ref)(t[0]),i=(0,a.ref)(null),r=(0,a.ref)(24),s=(0,a.ref)(24),u=(0,a.ref)(!1);let d=0,m=0,v=0,h=0,g=!1;const p=(0,a.computed)(()=>({right:`${r.value}px`,top:`${s.value}px`}));function f(e){d=e.clientX,m=e.clientY,v=r.value,h=s.value,g=!1,document.addEventListener('pointermove',b),document.addEventListener('pointerup',k)}function b(e){const t=e.clientX-d,n=e.clientY-m;if(!g&&Math.abs(t)<4&&Math.abs(n)<4)return;g=!0,u.value=!0;const a=i.value;if(!a)return;const l=a.offsetWidth,o=a.offsetHeight,c=window.innerWidth,p=window.innerHeight;let f=v-t,b=h+n;f=Math.max(0,Math.min(f,c-l)),b=Math.max(0,Math.min(b,p-o)),r.value=f,s.value=b}function k(){document.removeEventListener('pointermove',b),document.removeEventListener('pointerup',k),setTimeout(()=>{u.value=!1},0)}function y(){g||(o.value=!1,(0,a.nextTick)(()=>{const e=i.value;if(!e)return;const t=window.innerWidth,n=window.innerHeight,a=e.offsetWidth,l=e.offsetHeight;r.value+a>t&&(r.value=Math.max(0,t-a)),s.value+l>n&&(s.value=Math.max(0,n-l))}))}let E=null;function N(){E&&(E.pause(),E.rem
