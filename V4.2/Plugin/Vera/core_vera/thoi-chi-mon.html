    <div id="chat-container"></div>

    <script>

        const DB_PATH = {
            KEY: {
                EVENT: "Event"
            }
        };
        const K = DB_PATH.KEY;
        const TimeGateDataManager = {
            veraData: null,
            init: async function () {
                const findMvu = () => {
                    if (typeof window.Mvu !== 'undefined') return window.Mvu;
                    if (window.parent && typeof window.parent.Mvu !== 'undefined') return window.parent.Mvu;
                    return null;
                };
                // 1. 定义一个简单的等待函数
                const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
                let retries = 0;
                let mvuApi = findMvu();
                while (!mvuApi) {
                    if (retries > 60) { // 延长超时时间到 30秒 (60*500ms)
                        alert("Hết thời gian kết nối, vui lòng kiểm tra xem script mvu có tồn tại không");
                        return;
                    }

                    await wait(500);
                    retries++;
                    mvuApi = findMvu(); // 再次尝试查找
                }
                const timeGate = mvuApi.getMvuData({ type: 'message' }).stat_data?.[K.EVENT]?.Vera?.['Thời Chi Môn']
                this.veraData = timeGate ? { 'Thời Chi Môn': timeGate }
                    : {
                        'Thời Chi Môn': {
                            'Nút Hiện Tại': null,
                            'Nút Lịch Sử': {}
                        }
                    };
            },

            fetchData() {
                const findMvu = () => {
                    if (typeof window.Mvu !== 'undefined') return window.Mvu;
                    if (window.parent && typeof window.parent.Mvu !== 'undefined') return window.parent.Mvu;
                    return null;
                };
                let mvuApi = findMvu();
                const timeGate = mvuApi.getMvuData({ type: 'message' }).stat_data?.[K.EVENT]?.Vera?.['Thời Chi Môn']
                //console.log("读取数据",timeGate);
                this.veraData = timeGate ? { 'Thời Chi Môn': timeGate }
                    : {
                        'Thời Chi Môn': {
                            'Nút Hiện Tại': null,
                            'Nút Lịch Sử': {}
                        }
                    };
            },

            save() {
                const basePath = "stat_data";
                const eventK = K.EVENT;
                if (typeof insertOrAssignVariables === "function")
                    insertOrAssignVariables({ [basePath]: { [eventK]: { Vera: this.veraData } } }, { type: 'message' });
            },


        };

        /**
         * Chế độ xử lý 1: Tạo bản sao (Khởi tạo)
         */
        function handleInit(data) {
            TimeGateDataManager.fetchData();
            const Vera = TimeGateDataManager.veraData;
            if (Vera['Thời Chi Môn']['Nút Hiện Tại'] !== null) {
                if (!confirm("[TimeGate] Cảnh báo: Hiện tại đã có Nút Thời Chi Môn đang tiến hành, có muốn bắt buộc ghi đè không?")) {
                    console.log("[TimeGate] Thao tác bị hủy: Người dùng đã hủy việc ghi đè nút.");
                    throw new Error("USER_CANCELLED");
                }
            }

            // 生成唯一 ID
            const nodeId = 'gate_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

            // 构建并挂载完整的单次记录数据结构
            Vera['Thời Chi Môn']['Nút Hiện Tại'] = {
                id: nodeId,
                status: "active",
                meta_info: {
                    entry_type: data["Phương thức tiến vào"] || "未知",
                    difficulty: data["Độ khó"] || "未知",
                    participants: ensureArray(data["Người tham gia"])
                },
                timeline_info: {
                    real_world_entry_time: data["Thời gian hiện thực"] || "",
                    target_historical_time: data["Thời gian lịch sử"] || "",
                    target_location: data["Vị trí đáp xuống"] || "",
                    // 锁定区间可根据 target_historical_time 由额外脚本解析生成，此处预留
                    locked_period: { start: "", end: "" }
                },
                historical_context: {
                    background: data["Bối cảnh thời đại"] || "",
                    core_conflict: data["Cốt lõi điểm nút"] || "",
                    original_trajectory: data["Hướng đi lịch sử"] || ""
                },
                exploration_state: {
                    days_elapsed: 0
                },
                // narrative_log 改为数组对象，以天数为维度记录
                narrative_log: [],
                settlement: {
                    items_retrieved: [],
                    reality_shifts: []
                }
            };

            TimeGateDataManager.save();

            console.log(`[TimeGate] Phó bản đã được tạo, ID: ${nodeId}`, Vera['Thời Chi Môn']['Nút Hiện Tại']);
        }

        /**
         * Chế độ xử lý 2: Số ngày trải qua (Active)
         */
        function handleActive(data) {
            TimeGateDataManager.fetchData();
            const Vera = TimeGateDataManager.veraData;
            const currentNode = Vera['Thời Chi Môn']['Nút Hiện Tại'];
            if (!currentNode) {
                throw new Error("Không phát hiện Nút Thời Chi Môn nào đang tiến hành, không thể ghi lại hành động.");
            }

            const currentDay = parseInt(data["Số ngày hiện tại"]) || (currentNode.exploration_state.days_elapsed + 1);

            // 组合当天的行动与效应，推入 narrative_log 数组
            const dailyRecord = {
                day: currentDay,
                actions_taken: ensureArray(data["Hành động then chốt"]),
                butterfly_effects: ensureArray(data["Hiệu ứng cánh bướm"])
            };

            // 修改点：检查当前天数是否已存在记录
            const existingRecordIndex = currentNode.narrative_log.findIndex(log => log.day === currentDay);

            if (existingRecordIndex !== -1) {
                if (!confirm(`[TimeGate] Cảnh báo: Ngày thứ ${currentDay} đã có ghi chép, có muốn ghi đè/thêm vào không?`)) {
                    console.log(`[TimeGate] Thao tác bị hủy: Người dùng đã hủy việc ghi đè ghi chép ngày thứ ${currentDay}.`);
                    throw new Error("USER_CANCELLED");
                }
                if (confirm("Chọn Ghi đè/Thêm vào, Có: Ghi đè, Không: Thêm vào")) {
                    currentNode.narrative_log[existingRecordIndex] = dailyRecord;
                } else {
                    currentNode.narrative_log[existingRecordIndex].actions_taken.push(...dailyRecord.actions_taken);
                    currentNode.narrative_log[existingRecordIndex].butterfly_effects.push(...dailyRecord.butterfly_effects);
                }
                // 确认覆盖

            } else {
                // 不存在，正常推入
                currentNode.narrative_log.push(dailyRecord);
            }

            // 只有在保存成功后才更新总天数，避免取消操作污染数据
            currentNode.exploration_state.days_elapsed = Math.max(currentNode.exploration_state.days_elapsed, currentDay);

            TimeGateDataManager.save();
            console.log(`[TimeGate] Ghi chép ngày thứ ${currentDay} đã được cập nhật:`, dailyRecord);
        }

        /**
         * Chế độ xử lý 3: Tổng kết cuối cùng (Finish)
         */
        function handleFinish(data) {
            TimeGateDataManager.fetchData();
            const Vera = TimeGateDataManager.veraData;
            const currentNode = Vera['Thời Chi Môn']['Nút Hiện Tại'];
            if (!currentNode) {
                throw new Error("Không phát hiện Nút Thời Chi Môn nào đang tiến hành, không thể tổng kết.");
            }

            const nodeId = currentNode.id;

            // 修改点：检查历史节点中是否已存在相同的 ID
            if (Vera['Thời Chi Môn']['Nút Lịch Sử'] && Vera['Thời Chi Môn']['Nút Lịch Sử'][nodeId]) {
                if (!confirm(`[TimeGate] Cảnh báo: Đã có ghi chép tổng kết cho ID ${nodeId}, có muốn ghi đè không?`)) {
                    console.log(`[TimeGate] Thao tác bị hủy: Người dùng đã hủy việc ghi đè tổng kết nút.`);
                    throw new Error("USER_CANCELLED");
                }
            } else if (Vera['Thời Chi Môn']['Nút Lịch Sử'] && Object.values(Vera['Thời Chi Môn']['Nút Lịch Sử']).some(
                (v) => {
                    return (v.timeline_info.target_historical_time === currentNode.timeline_info.target_historical_time)
                        && (v.timeline_info.real_world_entry_time === currentNode.timeline_info.real_world_entry_time)
                }
            )) {
                if (!confirm(`[TimeGate] Cảnh báo: Có vẻ đã tồn tại một bản ghi lịch sử tương tự, bạn có muốn tiếp tục ghi đè không?`)) {
                    console.log(`[TimeGate] Thao tác bị hủy: Người dùng đã hủy việc ghi đè tổng kết nút.`);
                    throw new Error("USER_CANCELLED");
                }
            }

            // 写入结算数据
            currentNode.settlement.items_retrieved = ensureArray(data["Vật phẩm mang theo"]);
            currentNode.settlement.reality_shifts = ensureArray(data["Thay đổi hiện thực"]);
            currentNode.status = "finished";
            if (currentNode.narrative_log.length > 1) {
                const sorted_logs = currentNode.narrative_log.sort(function (a, b) {
                    return a.day - b.day
                });
                //console.log(sorted_logs);
                currentNode.narrative_log = sorted_logs;
            }

            // 转移到历史记录中 (持久化存储的源头)
            if (!Vera['Thời Chi Môn']['Nút Lịch Sử']) Vera['Thời Chi Môn']['Nút Lịch Sử'] = {}; // 确保初始化防报错
            Vera['Thời Chi Môn']['Nút Lịch Sử'][nodeId] = JSON.parse(JSON.stringify(currentNode)); // 深拷贝切断引用

            // 清理当前节点
            Vera['Thời Chi Môn']['Nút Hiện Tại'] = null;
            TimeGateDataManager.save();

            console.log(`[TimeGate] Nút ${nodeId} đã tổng kết và lưu trữ。`, Vera['Thời Chi Môn']['Nút Lịch Sử'][nodeId]);
        }


        /* =====================================================================
         * Hàm công cụ hỗ trợ
         * ===================================================================== */

        /**
         * Trình phân tích cú pháp YAML an toàn hạng nhẹ (chuyên xử lý cặp key-value và danh sách mảng)
         */
        function parseSimpleYAML(text) {
            const lines = text.split('\n');
            const result = {};
            let currentKey = null;

            for (let line of lines) {
                // 去除右侧空格，保留左侧缩进以便后续判断（如果需要）
                line = line.trimEnd();
                const trimmedLine = line.trim();

                if (!trimmedLine) continue; // Bỏ qua dòng trống

                // 判断是否为数组项: 以 "- " 开头
                if (trimmedLine.startsWith('- ')) {
                    if (currentKey) {
                        if (!Array.isArray(result[currentKey])) {
                            // 如果该键还不是数组，但遇到了数组项，则将其转换为数组
                            result[currentKey] = result[currentKey] ? [result[currentKey]] : [];
                        }
                        // 提取 "- " 之后的内容
                        const arrayItem = trimmedLine.replace(/^-\s*/, '').trim();
                        result[currentKey].push(arrayItem);
                    }
                    continue;
                }

                // 判断是否为键值对: "Key: Value" 或 "Key:"
                const match = trimmedLine.match(/^([^:]+):\s*(.*)$/);
                if (match) {
                    const key = match[1].trim();
                    const value = match[2].trim();
                    currentKey = key;

                    if (value) {
                        result[key] = value;
                    } else {
                        result[key] = []; // 遇到空值，预留为数组
                    }
                }
            }
            return result;
        }

        /**
         * 确保返回值为数组，增强健壮性
         */
        function ensureArray(val) {
            if (!val) return [];
            if (Array.isArray(val)) return val;
            return [val]; // 如果 AI 漏写了 "-" 导致解析成单行字符串，强制包装为数组
        }

        // ==========================================
        // 渲染器核心逻辑
        // ==========================================
        const TimeGateRenderer = {

            // 生成 KV 小方块
            buildKV(key, value) {
                if (!value) return '';
                return `
          <div class="tg-kv-box">
            <div class="tg-key">${key}</div>
            <div class="tg-value">${value}</div>
          </div>
        `;
            },

            // 生成列表区块
            buildList(title, items) {
                const arr = window.ensureArray(items);
                if (arr.length === 0) return '';
                const listHTML = arr.map(item => `<li>${item}</li>`).join('');
                return `
          <div class="tg-section">
            <div class="tg-section-title">${title}</div>
            <ul class="tg-list">${listHTML}</ul>
          </div>
        `;
            },

            // 生成文本区块
            buildText(title, text) {
                if (!text || typeof text !== 'string') return '';
                return `
          <div class="tg-section">
            <div class="tg-section-title">${title}</div>
            <div class="tg-text-block">${text}</div>
          </div>
        `;
            },

            // 根据 Type 组装 HTML
            generateInnerHTML(type, data, rawText) {
                let content = '';
                let titleName = '';

                if (type === 'init') {
                    titleName = "Xác lập Tọa độ Thời không (INIT)";
                    content += `
            <div class="tg-grid">
              ${this.buildKV('Độ khó', data['Độ khó'])}
              ${this.buildKV('Phương thức tiến vào', data['Phương thức tiến vào'])}
              ${this.buildKV('Thời gian hiện thực', data['Thời gian hiện thực'])}
              ${this.buildKV('Thời gian lịch sử', data['Thời gian lịch sử'])}
              ${this.buildKV('Vị trí đáp xuống', data['Vị trí đáp xuống'])}
            </div>
            ${this.buildList('Người tham gia', data['Người tham gia'])}
            ${this.buildText('Bối cảnh thời đại', data['Bối cảnh thời đại'])}
            ${this.buildText('Cốt lõi điểm nút', data['Cốt lõi điểm nút'])}
            ${this.buildText('Hướng đi lịch sử', data['Hướng đi lịch sử'])}
          `;
                }
                else if (type === 'active') {
                    titleName = `Ghi chép Quan sát Dị tượng (ACTIVE) - DAY ${data['Số ngày hiện tại'] || '?'}`;
                    content += `
            ${this.buildList('Hành động then chốt', data['Hành động then chốt'])}
            ${this.buildList('Hiệu ứng cánh bướm', data['Hiệu ứng cánh bướm'])}
          `;
                }
                else if (type === 'finish') {
                    titleName = "Tổng kết Tái cấu trúc Thế giới tuyến (FINISH)";
                    content += `
            ${this.buildList('Vật phẩm mang theo', data['Vật phẩm mang theo'])}
            ${this.buildList('Thay đổi hiện thực', data['Thay đổi hiện thực'])}
          `;
                }

                return `
          <div class="tg-header">
            <div class="tg-title">${titleName}</div>
          </div>
          <div class="tg-body">
            ${content}
          </div>
          <div class="tg-footer">
            <span class="tg-save-hint">Vui lòng đối chiếu ghi chép quan sát, sau khi xác nhận không có lỗi hãy cố định vào thiết bị đầu cuối cục bộ...</span>
            <button class="tg-btn-save" data-type="${type}">✦ Lưu trữ cố định</button>
          </div>
        `;
            },

            // 绑定持久化保存按钮
            bindSave(btn, type, data) {
                btn.addEventListener('click', () => {
                    try {

                        switch (type) {
                            case 'init':
                                handleInit(data);
                                break;
                            case 'active':
                                handleActive(data);
                                break;
