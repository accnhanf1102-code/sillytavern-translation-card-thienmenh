<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 3 交互式 3D 卡片</title>
    <script src="./src/vue.global.js"></script>

    <style>
        /* 基础页面样式 */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #app {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === 卡片核心变量 === */
        :root {
            --card-width: 320px;
            --card-height: 460px;
            --primary-color: #d4af37;
            /* 卡片主题色：金色 */
        }

        /* === 3D 容器 === */
        /* 修改: 移除绝对宽高，采用自适应和最大值限制 */
        .card-container {
            /* 初始限制大小，等图片加载后会动态应用 aspect-ratio  max-width: 90vw; max-height: 85vh;*/

            perspective: 1200px;
            cursor: pointer;
            /* 居中对齐内容 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* === 倾斜层 (由 JS 动态控制) === */
        .card-tilt {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            will-change: transform;
            /* 开启硬件加速，保证丝滑 */
        }

        /* 翻转层：独立于倾斜层，确保关闭 3D 时也能工作 */
        .card-flip {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .card-flip.is-flipped {
            transform: rotateY(180deg);
        }

        /* === 卡片正反面通用样式 === */
        /* 修改: 正面与背面现在仅用于包裹图片 */
        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 12px;
            /* 塔罗牌圆角通常较小 */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background-color: transparent;
            background-color: #121212;
            /* 给牌面一个基础底色 */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* 保证图片不畸形 */
            display: block;
        }

        /* === 正面视觉设计 === */
        .face-front {
            background: linear-gradient(135deg, #2a2a35 0%, #1a1a24 100%);
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
            color: white;
        }

        .card-header {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
        }

        .card-type {
            font-size: 12px;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-image-placeholder {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        .card-description {
            font-size: 14px;
            line-height: 1.6;
            color: #a0a0b0;
        }

        /* 背面容器：居中显示 SVG */
        .face-back {
            transform: rotateY(180deg);
            display: flex;
            justify-content: center;
            align-items: center;
            /* 添加一些深邃的背景渐变和暗纹 */
            background: radial-gradient(circle at 50% 50%, #1a1a24 0%, #0d0d12 100%);
            border: 2px solid #d4af37;
        }

        .back-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 20px;
            background-color: #121212;
        }

        /* 修改: 七彩全息反光层 (Holographic Foil Effect) */
        .glare {
            position: absolute;
            inset: 0;
            /* 七彩渐变带，模拟光栅效果 */
            /* 极窄的高光带，模拟锋利的折射光 */
            background: linear-gradient(105deg,
                    transparent 35%,
                    rgba(255, 100, 100, 0.15) 43%,
                    rgba(255, 255, 100, 0.15) 46%,
                    rgba(100, 255, 100, 0.15) 49%,
                    rgba(100, 255, 255, 0.15) 52%,
                    rgba(100, 100, 255, 0.15) 55%,
                    transparent 63%);
            /* 放大背景尺寸以便于移动 */
            background-size: 300% 300%;
            mix-blend-mode: color-dodge;
            /* 使用颜色减淡以防止覆盖原图黑色部分 */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        /* 外部控制面板样式 */
        .controls-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.8);
            padding: 15px;
            border-radius: 8px;
            color: white;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ==========================================
        新增: 悬浮球、主面板、概览视图样式
        ========================================== */
        .floating-sphere {
            position: fixed;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            /* 深空蓝到青蓝的渐变 */
            background: radial-gradient(circle at 30% 30%, #00f0ff, #0051ff, #0a0a2a);
            box-shadow: 0 4px 15px rgba(0, 81, 255, 0.6), inset 0 -4px 10px rgba(0, 0, 0, 0.5);
            cursor: grab;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-shadow: 0 0 5px #00f0ff;
            font-weight: bold;
            user-select: none;
            touch-action: none;
        }

        .floating-sphere:active {
            cursor: grabbing;
        }

        /* 修改: 主面板边缘与阴影转为蓝色系 */
        .main-window {
            position: fixed;
            inset: 5vh 5vw;
            background: rgba(10, 10, 20, 0.95);
            /* 更深的星空黑 */
            border: 1px solid rgba(0, 150, 255, 0.4);
            border-radius: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 20, 50, 0.9), 0 0 20px rgba(0, 150, 255, 0.1) inset;
        }

        .window-header {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid rgba(0, 150, 255, 0.2);
        }

        .tabs button {
            background: transparent;
            color: #aaa;
            border: none;
            font-size: 16px;
            margin-right: 20px;
            cursor: pointer;
            padding-bottom: 5px;
        }

        .tabs button.active {
            color: #00f0ff;
            border-bottom: 2px solid #00f0ff;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .window-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* 概览网格 */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .thumbnail-card {
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .thumbnail-img {
            width: 100%;
            aspect-ratio: 1 / 1.5;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            background: #000;
        }

        .thumbnail-img:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 150, 255, 0.4);
        }

        .card-controls {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .card-controls select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 4px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            color: white;
        }

        .pagination button {
            background: #333;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 详情弹窗 (接管原本的舞台全屏显示) */
        .detail-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
        }

        /* ==========================================
        新增: 遮罩层与总览控制栏样式
        ========================================== */
        .main-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 999;
        }

        .overview-controls-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #fff;
            background: rgba(0, 150, 255, 0.1);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid rgba(0, 150, 255, 0.2);
            font-size: 14px;
        }

        /* ==========================================
   新增: 详情面板控制栏折叠样式
   ========================================== */
        .detail-controls-wrapper {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2010;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .controls-toggle-btn {
            background: rgba(0, 150, 255, 0.1);
            border: 1px solid rgba(0, 150, 255, 0.4);
            color: #00f0ff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.3s;
        }

        .controls-toggle-btn:hover {
            background: rgba(0, 150, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 150, 255, 0.4);
        }

        .detail-controls-panel {
            background: rgba(10, 10, 20, 0.9);
            border: 1px solid rgba(0, 150, 255, 0.3);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        /* ==========================================
   修改: 占卜面板响应式布局 (适配小屏)
   ========================================== */
        .divination-board {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 允许在小屏幕上向下滚动，而不是隐藏截断 */
            justify-content: flex-start;
            padding-top: 30px;
            padding-bottom: 50px;
            overflow-y: auto;
        }

        /* 幽暗的背景层 */
        .divination-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.5;
            /* 调低亮度作为背景 */
            z-index: 0;
            pointer-events: none;
        }

        /* 控制台栏 */
        .divination-controls {
            position: relative;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            /* 核心：允许控制项自动换行 */
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            background: rgba(0, 20, 40, 0.7);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(0, 150, 255, 0.4);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            width: 90%;
            /* 防止在大屏上拉得太长，在小屏上留出边距 */
            max-width: 800px;
        }

        .divination-controls select,
        .divination-controls input {
            background: rgba(10, 10, 20, 0.8);
            color: #00f0ff;
            border: 1px solid rgba(0, 150, 255, 0.5);
            border-radius: 6px;
            padding: 6px 12px;
            max-width: 100%;
            /* 防止输入框撑破屏幕 */
        }

        .divination-btn {
            background: rgba(0, 150, 255, 0.2);
            color: #fff;
            border: 1px solid #00f0ff;
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .divination-btn:hover {
            background: rgba(0, 150, 255, 0.5);
            box-shadow: 0 0 10px #00f0ff;
        }

        .divination-btn-danger {
            border-color: #ff4444;
            color: #ff4444;
        }

        .divination-btn-danger:hover {
            background: rgba(255, 68, 68, 0.2);
            box-shadow: 0 0 10px #ff4444;
        }

        /* ==========================================
   修改: 占卜台牌面大小样式
   ========================================== */
        .spread-slots {
            position: relative;
            z-index: 10;
            display: flex;
            gap: 5vw;
            /* 从固定的 40px 改为动态视口宽度，防止大牌重叠 */
            flex-wrap: wrap;
            /* 屏幕较窄时允许换行 */
            justify-content: center;
        }

        .slot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .slot-label {
            color: #00f0ff;
            font-size: 16px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 150, 255, 0.5);
        }

        .slot-frame {
            /* 从 180px 改为响应式大小，显著放大牌面 */
            width: 18vw;
            max-width: 280px;
            min-width: 180px;

            aspect-ratio: 1 / 1.5;
            border: 2px dashed rgba(0, 150, 255, 0.2);
            border-radius: 12px;
            position: relative;
            perspective: 1000px;
        }

        /* 抽牌与翻转动画 */
        .divi-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .divi-card.is-flipped {
            transform: rotateY(180deg);
        }

        .divi-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 150, 255, 0.3);
            overflow: hidden;
        }

        /* 牌背复用样式 */
        .divi-back {
            background: radial-gradient(circle at 50% 50%, #1a1a24 0%, #0d0d12 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 牌面样式 (包含逆位旋转) */
        .divi-front {
            transform: rotateY(180deg);
            background: #000;
        }

        .divi-front img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .is-reversed img {
            transform: rotateZ(180deg);
        }

        /* 逆位图像翻转 */

        /* 进场动画 */
        .deal-enter-active {
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .deal-enter-from {
            opacity: 0;
            transform: translateY(100px) scale(0.5);
        }

        .deal-enter-to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* 美化版悬浮寓意框 */
        .meaning-tooltip {
            position: absolute;
            bottom: -90px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            background: rgba(5, 10, 20, 0.9);
            border: 1px solid rgba(0, 150, 255, 0.6);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 150, 255, 0.2) inset;
            color: #ddd;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
        }

        .meaning-tooltip .title {
            color: #00f0ff;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .slot-frame:hover .meaning-tooltip {
            opacity: 1;
        }



        /* ==========================================
           新增: 占卜历史记录模态框样式 (神秘学风格)
           ========================================== */
        .divi-history-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 15, 0.85);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .divi-history-content {
            background: linear-gradient(180deg, rgba(15, 15, 30, 0.95), rgba(5, 5, 15, 0.95));
            border: 1px solid rgba(138, 43, 226, 0.5); /* 神秘紫边框 */
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.2), inset 0 0 20px rgba(0, 150, 255, 0.1);
        }

        .divi-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px 12px 0 0;
        }

        .divi-history-title {
            color: #d4af37;
            font-size: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            margin: 0;
        }

        .divi-history-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: thin;
            scrollbar-color: rgba(138, 43, 226, 0.5) rgba(10, 10, 20, 0.3);
        }

        /* 针对 Webkit 内核的滚动条微调 */
        .divi-history-body::-webkit-scrollbar { width: 6px; }
        .divi-history-body::-webkit-scrollbar-track { background: rgba(10, 10, 20, 0.3); }
        .divi-history-body::-webkit-scrollbar-thumb { background: rgba(138, 43, 226, 0.4); border-radius: 4px; }
        
        /* 修改: 为占卜历史卡片添加相对定位，以便定位右上角删除键 */
        .divi-history-card {
            position: relative; /* 新增 */
            background: rgba(20, 20, 40, 0.6);
            border: 1px solid rgba(0, 150, 255, 0.2);
            border-left: 3px solid #8a2be2;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .divi-history-card:hover {
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.2);
            border-color: rgba(138, 43, 226, 0.5);
        }

        .divi-h-question {
            color: #00f0ff;
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .divi-h-cards {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .divi-h-card-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 13px;
            color: #ddd;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divi-h-tendency {
            color: #d4af37;
            font-size: 14px;
            margin-bottom: 10px;
            font-style: italic;
        }

        .divi-h-interpretations {
            color: #aaa;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 12px;
            padding-left: 10px;
            border-left: 2px dashed rgba(255, 255, 255, 0.1);
        }

        .divi-h-overall {
            background: rgba(138, 43, 226, 0.1);
            padding: 12px;
            border-radius: 6px;
            color: #eee;
            font-size: 14px;
            line-height: 1.5;
            border: 1px dashed rgba(138, 43, 226, 0.3);
        }

        /* ==========================================
   新增: 时间之门 (厚重、历史感) 样式
   ========================================== */
        .timegate-board {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            color: #e0d6c8;
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            /* 古典衬线体 */
            overflow: hidden;
        }

        .tg-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.45;
            z-index: 0;
            pointer-events: none;
            /* 2. 减弱复古滤镜的强度，让原图细节更清晰，稍微压暗防止刺眼 */
            filter: sepia(0.2) contrast(1.1) brightness(0.8);
        }

        .tg-header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;

        function useCardTilt(options = { maxRotation: 15 }) {
            const cardRef = ref(null);
            const rotateX = ref(0);
            const rotateY = ref(0);
            const isHovering = ref(false);
            // 新增：动态效果开关

            const calculateTilt = (clientX, clientY) => {
                if (!cardRef.value || !isDynamicEnabled.value) return;
                isHovering.value = true;

                const rect = cardRef.value.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                const xRatio = (x / rect.width) - 0.5;
                const yRatio = (y / rect.height) - 0.5;

                rotateY.value = xRatio * 2 * options.maxRotation;
                rotateX.value = -yRatio * 2 * options.maxRotation;

                bgPosX.value = 50 + (rotateY.value * 3);
                bgPosY.value = 50 - (rotateX.value * 3);
            };

            const handleMouseMove = (e) => calculateTilt(e.clientX, e.clientY);

            const handleTouchMove = (e) => {

                e.preventDefault();

                rotateX.value = 0;
                rotateY.value = 0;
                bgPosX.value = 50;
                bgPosY.value = 50;

                if (now - lastWheelTime < THROTTLE_INTERVAL) {

                const currentImgUrl = Vue.computed(() => {
                    return imageProvider.getUrl(targetCard.value, localVariation.value, currentStyleTag.value);
                });

                Vue.watch(currentImgUrl, () => resetPanZoom());

                // 新增: ESC 快捷键监听
                const handleKeydown = (e) => {
                    const key = e.key.toLowerCase();
                    if (key === 'escape') emit('close');
                    // 2. W / S 切换风格 (向下/向上遍历 availableStyles 数组)
                    if (key === 'w' || key === 's') {
                        if (availableStyles.value.length > 1) {
                            const currentIndex = availableStyles.value.findIndex(style => style.id === localStyleId.value);
                            let nextIndex;

                            if (key === 's') {
                                // S: 下一个风格 (超出回到底部)
                                nextIndex = (currentIndex + 1) % availableStyles.value.length;
                            } else {
                                // W: 上一个风格 (低于0回到顶部)
                                nextIndex = (currentIndex - 1 + availableStyles.value.length) % availableStyles.value.length;
                            }

                            localStyleId.value = availableStyles.value[nextIndex].id;
                        }
                    }

                    // 3. A / D 切换款式
                    if (key === 'a' || key === 'd') {
                        const max = currentMaxVariations.value;
                        if (max > 1) {
                            if (key === 'd') {
                                // D: 增大，超出最大值重置为 1
                                localVariation.value = localVariation.value >= max ? 1 : localVariation.value + 1;
                            } else {
                                // A: 减小，低于 1 回到最大值
                                localVariation.value = localVariation.value <= 1 ? max : localVariation.value - 1;
                            }
                        }
                    }
                };

                Vue.onMounted(() => {
                    window.addEventListener('keydown', handleKeydown);
                });

                Vue.onUnmounted(() => {
                    window.removeEventListener('keydown', handleKeydown);
                });

            setup() {
                const currentPage = Vue.ref(1);
                // 修改: 将每页数量从常量改为响应式变量，默认先给个 10
                const itemsPerPage = Vue.ref(10);
                const gridRef = Vue.ref(null);
                const totalPages = Vue.computed(() => Math.ceil(tarotConfig.length / itemsPerPage.value));

                // 新增: 款式控制框显示状态 (默认隐藏保证美观)
                const showCardControls = Vue.ref(false);

                // 附带真实索引的卡片列表，方便分页后依然能对应全局配置的 Index
                const mappedCards = tarotConfig.map((card, index) => ({ card, index }));
                const pagedCards = Vue.computed(() => {
                    const start = (currentPage.value - 1) * itemsPerPage.value;
                    return mappedCards.slice(start, start + itemsPerPage.value);

                // 新增: 动态计算某张牌实际可用的风格选项

                    // 遍历所有注册在 stylesConfig 里的风格字典，只返回配置数量大于 0 的风格
                    return stylesConfig.filter(style => cardVariations[style.id] && cardVariations[style.id] > 0);
                };

                const getMaxVar = (idx) => {
                    const conf = globalCardConfigs[idx];
                    return tarotConfig[idx].variations[conf.styleId] || 1;
                };

                const onStyleChange = (idx) => {
                    const max = getMaxVar(idx);
                    if (globalCardConfigs[idx].variation > max) {

                };

                const getThumbUrl = (idx) => {

                    if (!gridRef.value) return;
                    const containerWidth = gridRef.value.clientWidth;
                    // 这里的 180 是你在 CSS minmax(180px, 1fr) 中定义的最小列宽，25 是 gap 间距
                    const colWidth = 200;
                    const gap = 25;

                    // 数学推算: N * colWidth + (N - 1) * gap <= containerWidth
                    let cols = Math.floor((containerWidth + gap) / (colWidth + gap));
                    if (cols < 1) cols = 1;

                    // 强制每页显示 两行 的数量

                    cardsToPreload.forEach(item => {

                }, { immediate: true });

                    gridRef,

            template: `
    <div class="timegate-board">
      <div class="tg-bg" :style="{ backgroundImage: 'url(' + currentBg + ')' }"></div>
      
      <div class="tg-header">
        <h2 class="tg-title">时间之门枢纽</h2>
        <button class="tg-refresh-btn" @click="fetchData" :disabled="isLoading">
          {{ isLoading ? '时空共鸣中...' : '重新接驳数据' }}
        </button>
      </div>

      <div class="tg-layout">
        <div class="tg-pane">
          <div class="tg-pane-title">当前激活节点</div>
          <div class="tg-content-scroll">
            <template v-if="currentNode">
              <node-detail-view :node="currentNode" />
            </template>
            <div v-else style="text-align: center; color: #666; margin-top: 50px; display: flex; flex-direction: column; align-items: center; gap: 20px;">
                <div style="font-style: italic;">[门处于沉睡状态，暂无进行中的干涉任务]</div>
                
                <button 
                    class="tg-refresh-btn" 
                    style="border-color: #00f0ff; color: #00f0ff; background: rgba(0, 240, 255, 0.05); padding: 10px 25px; font-size: 15px;"
                    onmouseover="this.style.boxShadow='0 0 15px rgba(0, 240, 255, 0.4)'; this.style.background='rgba(0, 240, 255, 0.15)'"
                    onmouseout="this.style.boxShadow='none'; this.style.background='rgba(0, 240, 255, 0.05)'"
                    @click="openTimeGate"
                >
                    🌌 开启时间之门
                </button>
            </div>
          </div>
        </div>

        <div class="tg-pane tg-pane-right">
          <div class="tg-pane-title">历史残卷归档</div>
          <div class="tg-content-scroll">
            <div v-if="historyNodes.length === 0" style="text-align: center; color: #666; margin-top: 50px;">
              [尚未有成功收束的历史记录]
            </div>
            
            <div 
            class="tg-history-card" 
                v-for="hNode in historyNodes" 
                :key="hNode.id"
                @click="selectedHistoryNode = hNode"
            >
                <button class="tg-delete-btn" @click.stop="deleteHistoryNode(hNode.id)">×</button>
                <div style="font-size: 16px; color: #cda776; margin-bottom: 8px;">
                    {{ hNode.timeline_info.target_historical_time }}
                </div>
                <div style="font-size: 13px; color: #aaa; margin-bottom: 4px;">
                    降落点：{{ hNode.timeline_info.target_location }}
                </div>
                <div style="font-size: 13px; display: flex; justify-content: flex-start; gap: 30px; padding-right: 80px;">
                    <span style="color: #ff6b6b;">难度: {{ hNode.meta_info.difficulty }}</span>
                    <span style="color: #8a755d;">参与者: {{ hNode.meta_info.participants.join(', ') }}</span>
                </div>
                
                <button 
                    class="tg-visibility-toggle" 
                    :class="{ 'is-visible': archiveVisibility[hNode.id] !== false }"
                    @click.stop="toggleVisibility(hNode.id)"
                >
                    {{ archiveVisibility[hNode.id] !== false ? '👁 展示中' : '去展示' }}
                </button>
            </div>
          </div>
        </div>
      </div>

      <div class="tg-modal-overlay" v-if="selectedHistoryNode" @click.self="selectedHistoryNode = null">
        <div class="tg-modal-content">
          <button class="tg-modal-close" @click="selectedHistoryNode = null">×</button>
          <div class="tg-pane-title" style="border-radius: 8px 8px 0 0;">归档详情查阅</div>
          <div class="tg-content-scroll">
            <node-detail-view :node="selectedHistoryNode" />
          </div>
        </div>
      </div>

    </div>
  `,
            components: {
                // 注册内部渲染组件
                'node-detail-view': {
                    props: ['node'],
                    template: NodeDetailTemplate
                }
            },
            setup() {
                const isLoading = Vue.ref(false);
                const currentNode = Vue.ref(null);
                const historyNodes = Vue.ref([]);
                const selectedHistoryNode = Vue.ref(null);
                const currentBg = Vue.ref('');

                // ==========================================
                // 新增: 历史档案展示状态持久化逻辑
                // ==========================================
                const savedVisibility = localStorage.getItem('timeGate_archiveVisibility');
                // 默认状态为 true (展示)，未记录的节点也视作展示
                const archiveVisibility = Vue.reactive(savedVisibility ? JSON.parse(savedVisibility) : {});

                Vue.watch(archiveVisibility, (newVal) => {
                    localStorage.setItem('timeGate_archiveVisibility', JSON.stringify(newVal));
                }, { deep: true });

                const toggleVisibility = (id) => {
                    if (archiveVisibility[id] === undefined) {
                        archiveVisibility[id] = false; // 首次点击，从默认 true 变为 false
                    } else {
                        archiveVisibility[id] = !archiveVisibility[id];
                    }
                };

                // 根据 Vera 形态抽取背景
                const updateBackground = () => {
                    const form = VeraConfigStore.state.currentForm || 'default';
                    const bgList = TIMEGATE_BG_CONFIG[form] || TIMEGATE_BG_CONFIG['default'];
                    // 随机抽取一张
                    const randomBg = bgList[Math.floor(Math.random() * bgList.length)];
                    currentBg.value = randomBg;
                };

                const fetchData = async () => {
                    if (isLoading.value) return;
                    isLoading.value = true;
                    updateBackground(); // 每次刷新数据时同步刷新背景

                    try {
                        await veraDataAPI.refreshData();
                        const rawData = veraDataAPI.veraData;
                        const gateData = rawData["时间之门"];

                        currentNode.value = gateData["当前节点"] || null;

                        // 将历史节点对象转化为数组以便循环
                        const historyObj = gateData["历史节点"] || {};
                        historyNodes.value = Object.values(historyObj).sort((a, b) => {
                            // 简单的按进入时间倒序排
                            return new Date(b.timeline_info.real_world_entry_time) - new Date(a.timeline_info.real_world_entry_time);
                        });

                    } catch (err) {
                        console.error("时间之门数据接驳失败:", err);
                    } finally {
                        isLoading.value = false;
                    }
                };

                // 新增: 删除历史节点函数
                const deleteHistoryNode = (id) => {
                    veraDataAPI.deleteTimeGateHistoryNode(id); // 调用底层删除
                    historyNodes.value = historyNodes.value.filter(node => node.id !== id); // 同步刷新前端列表
                    
                    // 容错：如果当前正打开着该节点的详情弹窗，则顺便关闭弹窗
                    if (selectedHistoryNode.value && selectedHistoryNode.value.id === id) {
                        selectedHistoryNode.value = null;
                    }
                };

                // ==========================================
                // 新增: 开启时间之门函数
                // ==========================================
                const openTimeGate = () => {
                    // 这里构造你想要发送给后端的 Prompt
                    const promptPayload = {
                        action: "open_gate",
                        timestamp: Date.now(),
                        prompt: "请求开启新的时间之门节点，启动随机历史干涉任务。请生成初始历史背景与降落坐标。"
                    };

                    // 暂时打印到控制台
                    console.log("【时空枢纽指令发送】:", JSON.stringify(promptPayload, null, 2));

                    // TODO: 之后在这里替换为真实的 API 请求，请求成功后可以调用 fetchData() 刷新页面
                };

                // 初始加载
                Vue.onMounted(() => {
                    VeraConfigStore.load(); // 模拟加载状态
                    fetchData();
                });

                return {
                    isLoading, fetchData, currentBg,
                    currentNode, historyNodes, selectedHistoryNode,
                    archiveVisibility, toggleVisibility,
                    openTimeGate,
                    deleteHistoryNode
                };
            }
        };


        // ==========================================
        // 模块 3: 初始化 Vue 实例
        // ==========================================
        const app = createApp({
            components: { CardOverview, CardDetailModal, DivinationBoard, TimeGateBoard },
            template: `

                <div class="main-backdrop" v-if="isPanelOpen" @click="isPanelOpen = false"></div>
                <div 
                    v-show="!isPanelOpen"
                    class="floating-sphere"
                    :style="{ left: sphereX + 'px', top: sphereY + 'px' }"
                    @pointerdown.stop.prevent="onSphereDown"
                    @pointerup="onSphereUp"
                    @click.stop.prevent
                >
                V
                </div>

                <div class="main-window" v-if="isPanelOpen">
                <div class="window-header">
                    <div class="tabs">
                    <button :class="{ active: activeTab === 'divination' }" @click="activeTab = 'divination'">塔罗占卜</button>
                    <button :class="{ active: activeTab === 'overview' }" @click="activeTab = 'overview'">卡牌总览</button>
                    <button :class="{ active: activeTab === 'timegate' }" @click="activeTab = 'timegate'">时间之门</button>
                    <button :class="{ active: activeTab === 'config' }" @click="activeTab = 'config'">配置项</button>
                    </div>
                    <button class="close-btn" @click="isPanelOpen = false">×</button>
                </div>
                
                <div class="window-content">
                    <div v-if="activeTab === 'placeholder'" style="color: #aaa; text-align: center; margin-top: 50px;">
                    <h2>系统核心占位</h2>
                    <p>此面板预留给后续系统扩展...</p>
                    </div>

                    <div v-if="activeTab === 'divination'" style="height: 100%;">
                        <divination-board />
                    </div>
                    
                    <card-overview 
                        v-if="activeTab === 'overview'" 
                        v-model:global3dEnabled="global3dEnabled"
                        @preview="openPreview" 
                    />

                    <div v-if="activeTab === 'timegate'" style="height: 100%;">
                        <time-gate-board />
                    </div>
                </div>
                </div>

                <card-detail-modal 
                v-if="previewCardIndex !== null"
                :card-index="previewCardIndex"
                :initial-style-id="previewStyleId"
                :initial-variation="previewVariation"
                :initial-3d-enabled="global3dEnabled"
                @close="previewCardIndex = null"
                />
            `,

            setup() {
                const isPanelOpen = Vue.ref(false);
                const activeTab = Vue.ref('divination'); // 默认打开总览页
                // 新增: 全局 3D 状态持久化 (控制详情页初始是否具有 3D 效果)
                const saved3D = localStorage.getItem('tarotGlobal3D');
                const global3dEnabled = Vue.ref(saved3D !== null ? JSON.parse(saved3D) : true);

                // 监听变化并存储
                Vue.watch(global3dEnabled, (val) => {
                    localStorage.setItem('tarotGlobal3D', JSON.stringify(val));
                });

                // 悬浮球逻辑
                const {
                    x: sphereX, y: sphereY,
                    onPointerDown: onSphereDown, checkClick
                } = useDraggableSphere();

                const onSphereUp = (e) => {
                    // 只有当没有发生实质性拖拽时，才认为是点击事件，打开面板
                    if (checkClick()) {
                        isPanelOpen.value = true;
                    }
                };
                // 新增: 处理主面板的全局 ESC 事件 (解决层级冲突)
                const handleGlobalEsc = (e) => {
                    if (e.key === 'Escape') {
                        // 【核心拦截】如果详情弹窗正在显示，说明用户是想关弹窗，主面板不作为
                        if (previewCardIndex.value !== null) {
                            return;
                        }

                        // 否则，如果主面板开着，关闭主面板
                        if (isPanelOpen.value) {
                            isPanelOpen.value = false;
                        }
                    }
                };

                // 在根组件挂载时监听全局键盘事件
                Vue.onMounted(() => {
                    window.addEventListener('keydown', handleGlobalEsc);
                });

                Vue.onUnmounted(() => {
                    window.removeEventListener('keydown', handleGlobalEsc);
                });

                // 预览弹窗逻辑
                const previewCardIndex = Vue.ref(null);
                const previewStyleId = Vue.ref('');
                const previewVariation = Vue.ref(1);

                const openPreview = (index) => {
                    previewCardIndex.value = index;
                    // 提取该卡片在总览中配置的全局状态，传递给弹窗作为初始状态
                    previewStyleId.value = globalCardConfigs[index].styleId;
                    previewVariation.value = globalCardConfigs[index].variation;
                };

                return {
                    isPanelOpen, activeTab,
                    global3dEnabled,
                    sphereX, sphereY, onSphereDown, onSphereUp,
                    previewCardIndex, previewStyleId, previewVariation, openPreview
                };
            }

        });

        app.mount('#app');
    </script>
</body>

</html>
